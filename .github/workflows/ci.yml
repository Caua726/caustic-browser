name: test

# Caustic is not on any package index, so CI installs the toolchain the way a
# person does: the published Linux release, unpacked, on PATH.
#
# The second step exists because caustic-media needs a newer compiler than the
# latest release: v0.1.11 rejects `return 0 - 1;` in a function returning i32, in
# window/x11/text.cst. Delete it once a release can build this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Caustic toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Caua726/Caustic \
            --pattern 'caustic-x86_64-linux.tar.gz' --output caustic.tar.gz
          tar xzf caustic.tar.gz
          echo "$PWD/caustic-x86_64-linux/bin" >> "$GITHUB_PATH"

      - name: Build a current toolchain
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/Caua726/Caustic "$RUNNER_TEMP/caustic-src"
          cd "$RUNNER_TEMP/caustic-src"
          caustic-mk build caustic
          caustic-mk build caustic-as
          caustic-mk build caustic-ld
          caustic-mk build caustic-mk
          cp caustic caustic-as caustic-ld caustic-mk \
            "$GITHUB_WORKSPACE/caustic-x86_64-linux/bin/"
          cp -r std/. "$GITHUB_WORKSPACE/caustic-x86_64-linux/lib/caustic/std/"

      - name: Test
        run: caustic-mk run test-ci
